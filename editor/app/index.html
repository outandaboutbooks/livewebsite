<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit website | Out and About Books</title>
<link rel="icon" href="/site-assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a class="top__brand" href="#/books"><img src="/site-assets/img/brand/logo-stacked-books-colour.svg" alt="" width="66" height="48"><span>Website editor</span></a>
  <span class="top__note">Working on the copy on this computer</span>
  <button class="btn btn--primary" type="button" id="preview-btn">Preview website</button>
</header>
<div class="layout">
  <nav class="side" aria-label="Sections">
    <ul>
      <li><a href="#/books" data-nav="books">Books</a></li>
      <li><a href="#/merch" data-nav="merch">Shop items</a></li>
      <li><a href="#/pages" data-nav="pages">Pages</a></li>
      <li><a href="#/home" data-nav="home">Home page text</a></li>
      <li><a href="#/bookorder" data-nav="bookorder">Book order</a></li>
      <li><a href="#/menu" data-nav="menu">Menu order</a></li>
      <li><a href="#/settings" data-nav="settings">Site settings</a></li>
    </ul>
    <p class="side__help">Changes are saved to the <strong>content</strong> folder on this computer. Click <strong>Preview website</strong> to see them.</p>
  </nav>
  <main id="main" class="main" tabindex="-1"><p class="loading">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/rich.js"></script>
<script src="/schema.js"></script>
<script src="/app.js"></script>
</body>
</html>
