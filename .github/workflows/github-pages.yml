# Publishes the website on GitHub Pages every time something changes on GitHub
# (including every save in Pages CMS), and once a day so promotions start and end on their dates.
#
# Set-up, once: on GitHub open the repository, then Settings > Pages, and set Source to
# "GitHub Actions". The address appears at the top of that page after the first run.
# It works at https://yourname.github.io/your-repository/ and on your own domain once you
# add it under Settings > Pages > Custom domain.
#
# GitHub Pages can't run send.php, so the newsletter and review forms are hidden and the
# contact page shows a short note instead of the form.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Gives the site's address (github.io or your own domain) to the build.
      - id: pages
        uses: actions/configure-pages@v6

      # Works whether the website files are at the top of the repository or inside a folder.
      - name: Find the website folder
        run: |
          f=$(find . -maxdepth 3 -name build.mjs -not -path "*/node_modules/*" | head -1)
          if [ -z "$f" ]; then echo "Couldn't find build.mjs. Upload the whole website folder, including build.mjs and the content folder."; exit 1; fi
          echo "SITE_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Build the website
        env:
          OAB_SITE_URL: ${{ steps.pages.outputs.base_url }}
          OAB_BASE: ${{ steps.pages.outputs.base_path }}
          OAB_FORMS: "off"
        run: |
          cd "$SITE_DIR"
          node build.mjs
          # Only a host that runs PHP can use these.
          rm -f _site/send.php _site/.htaccess
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
